# This workflow will install Python dependencies and run tests in a Windows environment.
# This is intended to catch any file-system specific issues, and so runs less
# frequently than other test suites.

name: Windows unit test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
    - name: Install dependencies
      run: |
        uv pip install --system -e .[dev]
        uv pip install --system -e .[full]
    - name: Run unit tests with pytest
      run: |
        python -m pytest -o log_cli=true --timeout=0 tests
